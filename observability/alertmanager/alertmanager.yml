global:
  resolve_timeout: 5m

route:
  receiver: webhook-receiver
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: webhook-receiver
    webhook_configs:
      - url: "http://webhook-receiver:8080/alert"
        send_resolved: true

    # A real deployment would send mail instead of (or in addition to) the
    # webhook above. Never commit real SMTP credentials - inject them via
    # environment/secrets at deploy time. Example shape:
    #
    #   email_configs:
    #     - to: "oncall@example.com"
    #       from: "alertmanager@example.com"
    #       smarthost: "smtp.example.com:587"
    #       auth_username: "alertmanager@example.com"
    #       auth_password: "REPLACE_WITH_SECRET"
